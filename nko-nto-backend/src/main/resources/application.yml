server:
  port: 10001
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:5432/nko-nto
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PW:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      indent_output: true
    default-property-inclusion: non_null

firebase:
  service-account: ${FIREBASE_SERVICE_ACCOUNT:classpath:firebase-config.json}

nkonto:
  security:
    super-admins:
      - manuelgerstner@gmail.com
  currencies:
    - USD
    - ZAR
  supported-currencies:
    - EUR
    - USD
    - ZAR
  cors:
    allowed-origins:
      - http://localhost:3000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    de.nkotech.nkonto: DEBUG
    org.springframework: INFO
